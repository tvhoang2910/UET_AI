server:
  port: 8080
ollama:
  base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
  chat-model: qwen3:8b
  embedding-model: qwen3-embedding:4b
qdrant:
  url: ${QDRANT_URL:http://localhost:6333}
  collection: student_documents
documents:
  storage-dir: ./data/documents
rag:
  top-k: 5
  chunk-size: 1200
  chunk-overlap: 200
  score-threshold: 0.25
  embedding-batch-size: 16
jwt:
  secret: ${JWT_SECRET:YWJjZGVmZ2hpamtsbW5vcHFyc3R1dnd4eXoxMjM0NTY3ODkwISFAIyQ=}
  expirationMs: ${JWT_EXPIRATION_MS:86400000}
spring:
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB
  application:
    name: chatbot
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mariadb://localhost:3306/chatbot?allowPublicKeyRetrieval=true&useSSL=false}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:27092005}
    driver-class-name: org.mariadb.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
management:
  endpoint:
    health:
      show-details: always
  endpoints:
    web:
      exposure:
        include: health,info