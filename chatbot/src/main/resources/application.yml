server:
  port: 8080
qdrant:
  url: ${QDRANT_URL:http://localhost:6333}
  collection: student_documents
documents:
  storage-dir: ./data/documents
ocr:
  enabled: true
  data-path: ${TESSDATA_PREFIX:D:/KLTN/UET_AI/chatbot/tessdata}
  language: vie+eng+osd
  min-text-length-for-ocr: 50
minio:
  url: ${MINIO_URL:http://localhost:9000}
  access-key: ${MINIO_ACCESS_KEY:minioadmin}
  secret-key: ${MINIO_SECRET_KEY:minioadmin}
  bucket: ${MINIO_BUCKET:documents}
rag:
  top-k: 5
  chunk-size: 1200
  chunk-overlap: 200
  score-threshold: 0.25
  embedding-batch-size: 16
jwt:
  secret: ${JWT_SECRET:YWJjZGVmZ2hpamtsbW5vcHFyc3R1dnd4eXoxMjM0NTY3ODkwISFAIyQ=}
  expirationMs: ${JWT_EXPIRATION_MS:86400000}
spring:
  ai:
    model:
      chat: ollama
      embedding: ollama
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      chat:
        model: ${OLLAMA_CHAT_MODEL:qwen3:8b}
        options:
          temperature: 0.2
          num-ctx: 8192
      embedding:
        model: ${OLLAMA_EMBEDDING_MODEL:qwen3-embedding:4b}
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB
  application:
    name: chatbot
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mariadb://localhost:3306/chatbot?allowPublicKeyRetrieval=true&useSSL=false}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:27092005}
    driver-class-name: org.mariadb.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
management:
  endpoint:
    health:
      show-details: always
  endpoints:
    web:
      exposure:
        include: health,info
